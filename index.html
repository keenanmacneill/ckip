<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ckip/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civil Knowledge Integration Platform</title>
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search) {
          var p = new URLSearchParams(search).get('p');
          if (p) {
            var query = new URLSearchParams(search).get('q');
            history.replaceState(null, null,
              '/ckip' + p.replace(/~and~/g, '&') +
              (query ? '?' + query.replace(/~and~/g, '&') : '') +
              location.hash
            );
          }
        }
      })();
    </script>
    <script type="module" crossorigin src="/ckip/assets/index-CxQ9UnOD.js"></script>
    <link rel="stylesheet" crossorigin href="/ckip/assets/index-DOMD5IpE.css">

  </body>
</html>
